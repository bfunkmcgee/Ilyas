# Every push to main, every candidate (python3 test.py github pushes the working tree to try/candidate), every pull request, and by
# hand from the Actions tab ("Run workflow"):
#   quick  the build, the static check and the game-logic suites (no browser, about two minutes)
#   pages  once quick has passed: every suite in Playwright's Chromium and the live check (python3 test.py full --no-timing, 10 to
#          16 minutes). Not the timing checks or the look review: both time the drawing against limits set on the machine the game
#          is made on (GUIDE.md, "Tests"), and a runner's timings are not that machine's. They run there before each version is
#          published. It ends by packing its passes and their outputs into its log (python3 test.py --export), where test.py full and
#          --status on that machine take those whose inputs hold there what they held here. Each suite's output (test_out/*.txt) is
#          kept with the run for two weeks too, passed or failed; the checks that failed are printed in the log ("What failed").
# A newer push to the same branch cancels a run still going.
name: checks
on:
  push:
    branches: [main, 'try/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 build.py
      - run: python3 test.py
  pages:
    needs: quick
    # (24.04, not ubuntu-latest: Playwright 1.56, whose Chromium the game is made with, will not install on Ubuntu 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and what it needs
        run: npx playwright install --with-deps chromium
      - name: The page suites
        run: python3 test.py full --no-timing --here
      # (since V117: the checks that failed, in the log itself. The kept outputs cannot always be fetched where the game is made)
      - name: What failed
        if: failure()
        run: 'grep -H -m 20 "^FAIL" test_out/*.txt | cut -c1-3000 || true'
      - name: The passes, for test.py on the machine the game is made on
        if: always()
        run: python3 test.py --export
      - name: Keep each suite's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_out/*.txt
          if-no-files-found: ignore
          retention-days: 14
